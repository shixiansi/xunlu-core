<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · xunlu-core WebUI</title>
  <link rel="stylesheet" href="/webui/static/style.css" />
  <script type="module" src="/webui/static/app.js" defer></script>
</head>
<body class="login-page" data-page="login">
  <div class="login-card">
    <h1 id="loginTitle">xunlu-core</h1>
    <p class="subtitle">请登录以管理插件配置</p>
    <form class="login-form" id="loginForm">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary">登 录</button>
    </form>
    <p class="login-footer" id="loginToast"></p>
  </div>
</body>
</html>
