<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xunlu-core WebUI</title>
  <link rel="stylesheet" href="/webui/static/style.css" />
  <script type="module" src="/webui/static/app.js" defer></script>
</head>
<body class="shell-page" data-page="dashboard">
  <aside class="sidebar">
    <div class="brand">
      <h1 id="uiTitle">xunlu-core</h1>
      <p class="sub">插件配置管理中心</p>
    </div>
    <div class="sidebar-section">
      <h3>插件列表</h3>
      <nav class="plugin-nav" id="pluginList"></nav>
    </div>
    <div class="sidebar-section" style="margin-top:8px">
      <button class="btn btn-secondary" id="btnReloadPlugins" style="width:100%;justify-content:center;">重新加载插件</button>
    </div>
    <div class="sidebar-footer">
      <p class="user" id="sessionUser">未登录</p>
      <button class="btn btn-ghost btn-sm" id="btnLogout">退出登录</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div>
        <h2 id="pluginTitle">系统概览</h2>
        <p class="desc" id="pluginDescription">选择一个插件以查看和修改配置</p>
      </div>
      <div class="tags" id="pluginTags"></div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="pluginPanel"></div>
  </div>
</body>
</html>
